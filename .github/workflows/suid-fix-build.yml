name: suid-fix build

# Builds this branch and publishes the backend and the APK to a Release.
# Re-runs update the same release, so the download links stay stable.

on:
  push:
    branches: [ "fix/directory-rootfs-nosuid" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Same toolchain release the upstream CI uses.
  TOOLCHAINS_URL: https://github.com/ravindu644/Droidspaces-OSS/releases/download/compilers-25843896720

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential wget zstd

      # The release URL names a fixed set of toolchains, so it is the whole key
      - name: Cache toolchains
        id: toolchains
        uses: actions/cache@v4
        with:
          path: ~/toolchains
          key: musl-toolchains-${{ env.TOOLCHAINS_URL }}

      # The app's own :app:buildBackend task runs `make aarch64 armhf x86_64 x86`,
      # so all four cross compilers have to be present before Gradle starts.
      - name: Download phone toolchains
        if: steps.toolchains.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"
          for t in aarch64-linux-musl arm-linux-musleabihf i686-linux-musl x86_64-linux-musl; do
            echo "[*] Downloading $t"
            wget -q "$TOOLCHAINS_URL/$t-cross.tar.zst"
            tar -xf "$t-cross.tar.zst" && rm -f "$t-cross.tar.zst"
          done
          ls "$HOME/toolchains"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # buildBackend compiles the four phone arches and backendAssets copies them
      # into the APK, so this one command produces both artifacts.
      - name: Build APK (debug signed)
        run: |
          cd Android
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleDebug

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: suid-fix-build
          name: Droidspaces suid fix build
          body: |
            Build of `fix/directory-rootfs-nosuid`: clear MS_NOSUID on a directory
            rootfs right after the self-bind, in the namespace pivot_root hands to
            the container.

            Directory rootfs containers previously inherited MS_NOSUID from /data and
            then could not run any setuid binary (sudo, su, passwd, ping). The only
            countermeasure ran in the parent after the monitor fork, so it raced the
            child's bind and lost whenever the bind got there first.

            Assets:
            - droidspaces-aarch64: aarch64 static backend with the fix
            - app-debug.apk: debug-signed APK that ships the same backends in assets
          files: |
            output/droidspaces-aarch64
            output/droidspaces-armhf
            output/droidspaces-x86_64
            output/droidspaces-x86
            Android/app/build/outputs/apk/debug/app-debug.apk
